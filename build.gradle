plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.ronse'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    api "com.fasterxml.jackson.core:jackson-databind:2.21.3"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"
    api "com.squareup.okhttp3:okhttp:5.3.0"
    api "org.json:json:20260522"

    api("io.socket:socket.io-client:2.1.2") {
        exclude group: "org.json", module: "json" because("Vulnerable version")
    }
}

test {
    useJUnitPlatform()
    enabled = false
}

tasks.withType(JavaExec).configureEach {
    systemProperty "file.encoding", "UTF-8"
}

java {
    withJavadocJar()
    withSourcesJar()
}

jar {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}

afterEvaluate {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                pom {
                    name.set('SirenJavaAPI')
                    description.set('Java SDK for the Siren API')
                }
            }
        }
    }
}